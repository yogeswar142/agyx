name: CI & Cross-Build Matrix

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows ARM64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            run_tests: false # cross-compile or run if native runner available
          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            run_tests: true
          # macOS Apple Silicon
          - os: macos-14
            target: aarch64-apple-darwin
            run_tests: true
          # Linux x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            run_tests: true

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          targets: ${{ matrix.target }}

      - name: Cargo Cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --target ${{ matrix.target }} --workspace

      - name: Run Tests
        if: matrix.run_tests
        run: cargo test --target ${{ matrix.target }} --workspace -- --test-threads=1
