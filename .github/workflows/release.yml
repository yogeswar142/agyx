name: Release Artifacts

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary_name: agyx.exe
            archive_name: agyx-v${{ github.ref_name }}-aarch64-pc-windows-msvc.zip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: agyx.exe
            archive_name: agyx-v${{ github.ref_name }}-x86_64-pc-windows-msvc.zip
          - os: macos-14
            target: aarch64-apple-darwin
            binary_name: agyx
            archive_name: agyx-v${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: agyx
            archive_name: agyx-v${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin agyx

      - name: Package Windows archive
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -DestinationPath "${{ matrix.archive_name }}"

      - name: Package Unix archive
        if: runner.os != 'Windows'
        run: |
          tar -czf "${{ matrix.archive_name }}" -C "target/${{ matrix.target }}/release" "${{ matrix.binary_name }}"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.archive_name }}
